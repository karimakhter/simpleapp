apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simpleapp
  namespace: simpleapp
  labels:
    app.kubernetes.io/name: simpleapp
spec:
  parentRefs:
    - name: edge
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - simple.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: simpleapp
          port: 80
